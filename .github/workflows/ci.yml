name: Build Pre-Patched Kasumi for O3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-cia:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      CTRULIB: /opt/devkitpro/libctru

    steps:
      - name: Checkout repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Vital for vendor and build-transport packages

      - name: Install System Build Essentials & Python
        run: |
          # The container uses Arch Linux instead of Ubuntu, so we use pacman
          pacman -Syu --noconfirm
          
          # This maps your requested dependencies to Arch Linux alternatives:
          # build-essential -> base-devel
          # libarchive-tools -> libarchive
          # libgtk-3-0 -> gtk3
          pacman -S --needed --noconfirm \
            git \
            make \
            cmake \
            base-devel \
            gcc \
            g++ \
            python \
            python-pip \
            wget \
            unzip \
            libarchive \
            gtk3

      - name: Install devkitPro 3DS SDK Packages
        run: |
          # Pull down Kasumi's dedicated 3DS tool requirements
          pacman -S --needed --noconfirm 3ds-dev 3ds-curl 3ds-jansson 3ds-mbedtls 3ds-libopus 3ds-cmake

      - name: Build and Install BannerTool from Source
        run: |
          git clone https://github.com
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cp build/bannertool /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool
          cd ..

      - name: Build and Install Makerom from Source
        run: |
          git clone --recursive https://github.com
          cd Project_CTR/makerom
          make deps
          make -j$(nproc)
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../..

      - name: Compile WebRTC Transport Layer
        run: |
          export PATH=$PATH:$DEVKITPRO/tools/bin
          bash tools/build-transport.sh

      - name: Compile Final O3DS CIA Package
        run: |
          export PATH=$PATH:$DEVKITPRO/tools/bin
          make clean
          make
          make cia MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool

      - name: Upload Custom O3DS CIA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kasumi-O3DS-ExtendedMemory
          path: ./*.cia
