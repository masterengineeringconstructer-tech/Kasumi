name: Build Pre-Patched Kasumi for O3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-cia:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Vital for vendor and build-transport packages

      - name: Install devkitPro 3DS Packages & Build Utilities
        run: |
          # Sync database and install the required dependencies mentioned in Kasumi's README
          # --noconfirm bypasses interactive prompts, --needed avoids reinstalling components
          apt-get update && apt-get install -y wget unzip
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm 3ds-dev 3ds-curl 3ds-jansson 3ds-mbedtls 3ds-libopus 3ds-cmake

      - name: Download 3DS OS Toolchain Binaries (makerom & bannertool)
        run: |
          # Pull down makerom (v0.18.4)
          wget https://github.com -O makerom.zip
          unzip makerom.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/makerom

          # Pull down bannertool (v1.2.0)
          wget https://github.com -O bannertool.zip
          unzip bannertool.zip -d /usr/local/bin/
          # Fix case variant if extracted archive uses capitals
          mv /usr/local/bin/bannertool* /usr/local/bin/bannertool || true
          chmod +x /usr/local/bin/bannertool

          # Clean archives
          rm makerom.zip bannertool.zip

      - name: Compile WebRTC Transport Layer
        run: |
          # Setup global devkitPro environment vars inside the step process execution context
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PATH=$PATH:$DEVKITPRO/tools/bin

          # Run the specific WebRTC initialization script noted in README
          bash tools/build-transport.sh

      - name: Compile Final O3DS CIA Package
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PATH=$PATH:$DEVKITPRO/tools/bin

          # Clear any legacy objects, build the raw 3DSX, then pack the modified CIA
          make clean
          make
          make cia MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool

      - name: Upload Custom O3DS CIA Artifact
        uses: actions/artifacts@v4
        with:
          name: Kasumi-O3DS-ExtendedMemory
          path: ./*.cia
