name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      CTRULIB: /opt/devkitpro/libctru

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Build Essentials & Python
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          git \
          make \
          cmake \
          build-essential \
          autoconf \
          automake \
          pkg-config \
          python3 \
          python3-pip \
          wget \
          unzip \
          libarchive-tools \
          libgtk-3-0 \
          libcurl4-openssl-dev \
          libjansson-dev \
          libopus-dev

    - name: Install Pre-compiled devkitARM Compiler Toolchain
      run: |
        # Download and configure the direct toolchain components for local cross-compilation
        sudo mkdir -p /opt/devkitpro
        wget https://github.com || true
        
        # Pull standalone GNU ARM Embedded Toolchain elements to provide arm-none-eabi-gcc
        wget https://arm.com -O compiler.tar.bz2
        sudo tar -xjf compiler.tar.bz2 -C /opt/devkitpro
        sudo mv /opt/devkitpro/gcc-arm-none-eabi-10.3-2021.10 /opt/devkitpro/devkitARM
        
        # Expose bin to path context
        echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

    - name: Build and Install libctru (>= 2.5.0) from Source
      run: |
        export PATH=$PATH:/opt/devkitpro/devkitARM/bin
        git clone https://github.com
        cd libctru/libctru
        make -j$(nproc)
        sudo make install
        cd ../..

    - name: Build and Install 3dstools / tex3ds from Source
      run: |
        git clone --recursive https://github.com
        cd 3dstools
        ./autogen.sh
        ./configure --prefix=/usr/local
        make -j$(nproc)
        sudo make install
        cd ..

    - name: Build and Install BannerTool from Source
      run: |
        git clone https://github.com
        cd 3ds-bannertool
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
        sudo cp build/bannertool /usr/local/bin/bannertool
        sudo chmod +x /usr/local/bin/bannertool
        cd ..

    - name: Build and Install Makerom from Source
      run: |
        git clone --recursive https://github.com/3DSGuy/Project_CTR
        cd Project_CTR/makerom
        make deps
        make -j$(nproc)
        sudo cp ./bin/makerom /usr/local/bin/makerom
        sudo chmod +x /usr/local/bin/makerom
        cd ../..

    - name: Compile Kasumi WebRTC Transport Layer
      run: |
        export PATH=$PATH:/opt/devkitpro/devkitARM/bin
        export PATH=$PATH:/usr/local/bin
        bash tools/build-transport.sh

    - name: Compile Final Kasumi O3DS CIA Package
      run: |
        export PATH=$PATH:/opt/devkitpro/devkitARM/bin
        export PATH=$PATH:/usr/local/bin
        make clean
        make
        make cia MAKEROM=/usr/local/bin/makerom BANNERTOOL=/usr/local/bin/bannertool

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: Kasumi-O3DS-ExtendedMemory
          path: ./*.cia
