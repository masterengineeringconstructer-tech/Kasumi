name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Build Essentials & Python
      run: |
        apt-get update && apt-get install -y --no-install-recommends \
          git \
          make \
          cmake \
          build-essential \
          python3 \
          python3-pip \
          wget \
          unzip \
          libarchive-tools \
          libgtk-3-0

    - name: Build and Install libctru (>= 2.5.0) from Source
      run: |
        git clone https://github.com/devkitPro/libctru.git
        cd libctru
        make && make install
        cd ..

    - name: Build and Install armips from Source
      run: |
        git clone --recursive https://github.com/Kingcom/armips.git
        cd armips
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        cmake --install build
        cp build/armips /usr/local/bin/armips
        chmod +x /usr/local/bin/armips
        cd ..

    - name: Build and Install 3dstools / tex3ds from Source
      run: |
        git clone --recursive https://github.com/devkitPro/3dstools.git
        cd 3dstools
        make && make install
        cd ..

    - name: Build and Install BannerTool from Source
      run: |
        git clone https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        cmake --install build
        cd ..

    - name: Build and Install Makerom from Source
      run: |
        git clone --recursive https://github.com/3DSGuy/Project_CTR
        cd Project_CTR/makerom
        make deps
        make
        cp ./bin/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
        cd ../..

    - name: Build and Install 3gxtool & Flips
      run: |
        # Clone 3gxtool from GitLab and explicitly initialize submodules
        git clone https://gitlab.com/ThePixellizerOSS/3gxtool.git
        cd 3gxtool
        git submodule update --init --recursive
        
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        
        # Locate the binary and install it globally with sudo
        sudo find build -name "3gxtool" -type f -exec cp {} /usr/local/bin/ \;
        sudo chmod +x /usr/local/bin/3gxtool
        cd ..

        # Download and install Flips
        wget -q https://github.com/Alcaro/Flips/releases/latest/download/flips-linux.zip -O flips.zip
        unzip -o flips.zip -d /usr/local/bin/
        chmod +x /usr/local/bin/flips

  
    - name: Clone and Build CTRPluginFramework
      run: |
        git clone https://gitlab.com/ThePixellizerOSS/ctrpluginframework.git plugin/CTRPluginFramework
        cd plugin/CTRPluginFramework
        # Remove -Werror from all Makefiles so GCC warnings don't stop the build
        find . -type f \( -name "Makefile" -o -name "makefile" -o -name "*.mk" \) -exec sed -i 's/-Werror//g' {} +
        make
        cd ../..

    - name: Pre-generate All Graphics Headers
      run: |
        mkdir -p app/build
        cd app/romfs/gfx
        for t3s in *.t3s; do
          if [ -f "$t3s" ]; then
            base_name="${t3s%.t3s}"
            echo "Compiling graphics: $base_name.t3s"
            tex3ds -i "$t3s" -H "../../build/${base_name}.h" -o "../../build/${base_name}.t3x"
          fi
        done

    - name: Build Components
      run: | 
        # Build in subdirectories, explicitly skipping 3gxtool since it was already built via CMake
        for dir in app patches plugin */; do
          if [ "$dir" != "3gxtool/" ] && { [ -f "${dir}Makefile" ] || [ -f "${dir}makefile" ]; }; then
            echo "Building in ${dir}..."
            make -C "${dir}" all
          fi
        done

        # Build root if applicable
        if [ -f "Makefile" ] || [ -f "makefile" ]; then
          make all
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: CIA-Artifacts
          path: | 
            cias/**/*
            3ds/**/*
            out/**/*
